model:
  name: baptle/FinBERT_market_based
  max_length: 128

dataset:
  name: baptle/financial_headlines_market_based
  text_column: "Title"
  label_column: "Global Sentiment"
  num_samples: 300
  val_split: 0.2
  seed: 42

training:
  learning_rate: 2.0e-5
  batch_size: 16
  num_epochs: 3
  # Set to -1 to run full epochs. Use a small number (e.g. 10) during live
  # demos so each epoch completes in seconds rather than minutes.
  max_steps: 10

mlflow:
  tracking_uri: http://127.0.0.1:5000
  experiment_name: finbert-financial-sentiment
  model_artifact_name: finbert-model
  tags:
    stage: dev
    dataset: financial-headlines
    model_base: FinBERT-market-based
