name: CI/CD Pipeline

# TODO: Configure the pipeline to trigger on every push to the main branch
on:
  push:
    branches:
    - main

env:
  ECR_REPOSITORY: beans-api
  TASK_DEFINITION: beans-api
  CONTAINER_NAME: beans-api
  ECS_SERVICE: beans-api-service
  ECS_CLUSTER: beans-api-cluster

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # TODO: Install ruff and run it against main.py and quality_check.py
      - run: pip install ruff
      - run: ruff check main.py quality_check.py

  quality-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # TODO: Add a pip cache keyed by the hash of requirements-quality.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-deepchecks-${{ hashFiles('requirements-quality.txt') }}
      # TODO: Add a HuggingFace model cache keyed by the model name
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-beans-vit
      # TODO: Install requirements-quality.txt
      - run: pip install -r requirements-quality.txt
      # TODO: Run quality_check.py
      - name: Run Deepchecks quality gate
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python quality_check.py

  build:
    runs-on: ubuntu-latest
    # TODO: this stage should start if both lint and quality-check succeed
    needs: [lint, quality-check]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      # TODO: Login to ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      # TODO: Build the Docker image tagged with the first 8 chars of the commit SHA
      #         + a timestamp (e.g. "abc12345-1714000000")
      # TODO: push the image
      # TODO: tag and push as :latest.
      # Make sure to use ECR registry env var and not hardcode the registry URI!
      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:8}-$(date +%s)"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          docker tag $IMAGE_URI $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      # TODO: Download the current task definition JSON
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json
      # TODO: Render the task definition with the :latest image
      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
      # TODO: deploy and wait for stability
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true