name: Fairness Check

on:
  push:
    branches:
      - main
    paths:
      - "module-27-fairlearn/**"

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module-27-fairlearn/exercise-starter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-fairlearn-${{ hashFiles('module-27-fairlearn/exercise-starter/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      # TODO: Upload the model and test data so the check-fairness job can use them
      # (model.joblib, X_test.npy, y_test.npy, sf_test.csv)
      - name: Upload model artifacts


  check-fairness:
    runs-on: ubuntu-latest
    needs: train
    defaults:
      run:
        working-directory: module-27-fairlearn/exercise-starter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-fairlearn-${{ hashFiles('module-27-fairlearn/exercise-starter/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

